server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect semua request ke index.html agar React Router berfungsi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|glb)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
